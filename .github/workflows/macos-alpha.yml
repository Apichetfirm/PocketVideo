name: macOS Alpha Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-alpha:
    name: Build PocketVideo macOS alpha
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Run backend + UI regression tests on macOS
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build alpha macOS App bundle
        run: bash packaging/build_macos.sh
      - name: Smoke-test macOS app binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/PocketVideo.app/Contents/MacOS/PocketVideo --version
          dist/PocketVideo.app/Contents/MacOS/PocketVideo --verify-video-player
          test -s dist/macos-alpha/PocketVideo-1.3.0-macos-alpha.zip
      - name: Upload alpha for technical testing only
        uses: actions/upload-artifact@v4
        with:
          name: PocketVideo-macOS-Alpha-Development
          path: |
            dist/macos-alpha/*.zip
            dist/macos-alpha/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

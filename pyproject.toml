[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketvideo"
version = "1.0.0"
description = "Open-Source Windows Video Compressor & Converter optimized for Android phone videos"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "PocketVideo Contributors"}
]
dependencies = [
    "PySide6>=6.6.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
pocketvideo = "pocketvideo.main:main"

[tool.setuptools.packages.find]
where = ["src"]
